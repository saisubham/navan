spring.application.name=navan

# Overridable with SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD
spring.datasource.url=jdbc:mysql://localhost:3306/navan?connectionTimeZone=UTC&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=navan
spring.datasource.password=navan

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# Money must never pass through double
spring.jackson.deserialization.use-big-decimal-for-floats=true
