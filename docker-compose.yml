services:
  mysql:
    container_name: db
    image: mysql:26.10.0
    environment:
      MYSQL_DATABASE: navan
      MYSQL_USER: ${MYSQL_USER:-navan}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-navan}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  app:
    container_name: app
    build: .
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/navan?connectionTimeZone=UTC&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-navan}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-navan}
    ports:
      - "8080:8080"
    healthcheck:
      # no curl in the JRE image: speak HTTP over bash's /dev/tcp
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

volumes:
  mysql-data:
